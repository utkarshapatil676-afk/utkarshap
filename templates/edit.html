<!DOCTYPE html>
<html>
<head>
    <title>Edit Task</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>Edit Task</h1>

    <form method="POST">

        <input
            type="text"
            name="title"
            value="{{ task.title }}"
            required
        >

        <button type="submit">
            Save Changes
        </button>

    </form>

    <br>

    <a href="/">Back to Tasks</a>

</body>
</html>
